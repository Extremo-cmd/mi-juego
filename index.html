<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zombie Shooter</title>

<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="assets/img/favicon.ico">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">🧟 Zombie Shooter</span>
  </div>
</nav>

<div class="container text-center mt-3">

    <h2>Zombie Shooter</h2>

    <p>
    🎯 Dispara a los zombies antes de que escapen<br>
    💀 Pierdes vidas si no los eliminas<br>
    ⚡ El juego se vuelve más difícil con el  tiempo
    </p>

    <div class="row">
        <div class="col"><h5>Score: <span id="score">0</span></h5></div>
        <div class="col"><h5>High Score: <span id="highScore">0</span></h5></div>
        <div class="col"><h5>Nivel: <span id="nivel">1</span></h5></div>
        <div class="col"><h5>Vidas: <span id="vidas">5</span></h5></div>
    </div>

    <div class="mt-2">
        <button class="btn btn-success" onclick="iniciarJuego()">Iniciar</button>
        <button class="btn btn-warning" onclick="pausar()">Pausa</button>
        <button class="btn btn-info" onclick="toggleMusica()">Música</button>
    </div>

    <canvas id="canvas" width="900" height="500"></canvas>

</div>

<footer class="bg-dark text-white text-center mt-3 p-2">
    Moreno Trejo Diego de Jesús
</footer>

<script src="assets/js/script.js"></script>
</body>
</html>
