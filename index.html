<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Zombie Shooter</title>

<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="assets/img/favicon.ico">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- MENU -->
<div id="menu" class="menu">
    <h1>🧟 Zombie Shooter</h1>
    <p>Elimina zombies antes de que lleguen al centro</p>
    <button class="btn btn-success" onclick="startGame()">▶ JUGAR</button>
</div>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">🧟 Zombie Shooter</span>
    <button class="btn btn-warning" onclick="pausar()">⏸ Pausa</button>
  </div>
</nav>

<div class="container text-center">

    <h2>Zombie Shooter</h2>

    <!-- HUD -->
    <div class="d-flex justify-content-center gap-4 flex-wrap mt-4">
        <h5>🎯 Score: <span id="score">0</span></h5>
        <h5>⚡ Nivel: <span id="nivel">1</span></h5>
        <h5>❤️ Vida: <span id="vida">100</span></h5>
    </div>

    <canvas id="canvas" width="900" height="500"></canvas>

</div>

<footer class="text-center p-2">
    Moreno Trejo Diego de Jesús
</footer>

<script src="assets/js/script.js"></script>
</body>
</html>
